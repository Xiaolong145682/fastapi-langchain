[project]
name = "fastapi-langchain"
version = "0.1.0"
description = "使用 uv、FastAPI 和 LangChain 接入 DeepSeek 的入门案例"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 与当前 Pyodide 的 HTTPX 传输及 WebAssembly 包保持兼容。
    "fastapi[standard]==0.136.1; sys_platform != 'emscripten'",
    "fastapi==0.136.1; sys_platform == 'emscripten'",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "langgraph==1.2.14",
    "langgraph-checkpoint==4.2.0",
    "langchain-core==1.4.9",
    "python-dotenv>=1,<2",
    "langchain==1.3.9",
    "langchain-openai==1.3.4",
    "openai==2.30.0; sys_platform == 'emscripten'",
    "langsmith==0.7.16; sys_platform == 'emscripten'",
    "uuid-utils==0.17.1; sys_platform == 'emscripten'",
]

[tool.uv]
package = false
